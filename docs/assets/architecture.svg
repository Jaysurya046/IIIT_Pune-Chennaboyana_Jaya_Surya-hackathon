<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title description">
  <title id="title">RiskSignal Engine system architecture</title>
  <desc id="description">Public and synthetic sources pass through ingestion, NLP analysis, persistence, APIs, portfolio stress testing, and a monitoring dashboard. Governance and validation span every layer.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b2545"/>
      <stop offset="1" stop-color="#134b70"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0b2545" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#277da1"/>
    </marker>
    <style>
      .title { font: 700 40px Arial, sans-serif; fill: #ffffff; }
      .subtitle { font: 400 20px Arial, sans-serif; fill: #d9eef7; }
      .lane { font: 700 19px Arial, sans-serif; letter-spacing: 1px; fill: #527184; }
      .card-title { font: 700 22px Arial, sans-serif; fill: #0b2545; }
      .card-text { font: 400 17px Arial, sans-serif; fill: #365466; }
      .small { font: 400 15px Arial, sans-serif; fill: #527184; }
      .inverse-lane { font: 700 19px Arial, sans-serif; letter-spacing: 1px; fill: #9ed8ee; }
      .inverse-title { font: 700 22px Arial, sans-serif; fill: #ffffff; }
      .inverse-small { font: 400 15px Arial, sans-serif; fill: #d9eef7; }
      .badge { font: 700 14px Arial, sans-serif; letter-spacing: .5px; }
      .arrow { stroke: #277da1; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .cross { stroke: #7b8790; stroke-width: 3; stroke-dasharray: 9 8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1800" height="1050" fill="#f5f8fa"/>
  <rect width="1800" height="128" fill="url(#header)"/>
  <text x="70" y="60" class="title">RiskSignal Engine</text>
  <text x="70" y="96" class="subtitle">Explainable unstructured-data intelligence to event-driven portfolio stress testing</text>
  <rect x="1515" y="42" width="215" height="45" rx="22" fill="#ffffff" opacity="0.14"/>
  <text x="1622" y="71" text-anchor="middle" class="badge" fill="#ffffff">OFFLINE REPRODUCIBLE</text>

  <text x="70" y="174" class="lane">1  SOURCES</text>
  <text x="410" y="174" class="lane">2  INGESTION</text>
  <text x="750" y="174" class="lane">3  RISK INTELLIGENCE</text>
  <text x="1110" y="174" class="lane">4  SERVICE LAYER</text>
  <text x="1450" y="174" class="lane">5  DECISION SUPPORT</text>

  <!-- Sources -->
  <g filter="url(#shadow)">
    <rect x="70" y="205" width="270" height="125" rx="16" fill="#ffffff" stroke="#bdd8e5" stroke-width="2"/>
    <circle cx="100" cy="238" r="10" fill="#2a9d8f"/>
    <text x="120" y="246" class="card-title">GDELT DOC API</text>
    <text x="95" y="280" class="card-text">Public news headlines</text>
    <text x="95" y="307" class="small">Live adapter · metadata only</text>

    <rect x="70" y="360" width="270" height="125" rx="16" fill="#ffffff" stroke="#bdd8e5" stroke-width="2"/>
    <circle cx="100" cy="393" r="10" fill="#2a9d8f"/>
    <text x="120" y="401" class="card-title">Bluesky AppView</text>
    <text x="95" y="435" class="card-text">Public social posts</text>
    <text x="95" y="462" class="small">Live adapter · optional token</text>

    <rect x="70" y="515" width="270" height="145" rx="16" fill="#fff8e7" stroke="#edb458" stroke-width="2"/>
    <circle cx="100" cy="548" r="10" fill="#f4a261"/>
    <text x="120" y="556" class="card-title">Offline Fixtures</text>
    <text x="95" y="590" class="card-text">Six source-shaped records</text>
    <text x="95" y="617" class="small">Synthetic · checksummed</text>
    <rect x="95" y="632" width="110" height="20" rx="10" fill="#f4a261"/>
    <text x="150" y="647" text-anchor="middle" class="badge" fill="#4c3108">DEFAULT</text>
  </g>

  <!-- Ingestion -->
  <g filter="url(#shadow)">
    <rect x="410" y="250" width="270" height="320" rx="18" fill="#eaf5fa" stroke="#73b3d3" stroke-width="2"/>
    <text x="440" y="295" class="card-title">Source Adapters</text>
    <text x="440" y="334" class="card-text">Validate source schema</text>
    <text x="440" y="370" class="card-text">Normalize text and UTC time</text>
    <text x="440" y="406" class="card-text">Preserve full provenance</text>
    <text x="440" y="442" class="card-text">Deduplicate within source</text>
    <text x="440" y="478" class="card-text">Isolate source failures</text>
    <rect x="430" y="515" width="220" height="32" rx="16" fill="#277da1"/>
    <text x="540" y="537" text-anchor="middle" class="badge" fill="#ffffff">RAW DOCUMENT CONTRACT</text>
  </g>

  <!-- NLP -->
  <g filter="url(#shadow)">
    <rect x="750" y="205" width="290" height="455" rx="18" fill="#ffffff" stroke="#82c4b6" stroke-width="2"/>
    <text x="780" y="250" class="card-title">AI / NLP Risk Engine</text>
    <rect x="780" y="280" width="230" height="58" rx="12" fill="#e8f6f3"/>
    <text x="895" y="315" text-anchor="middle" class="card-text">Entity resolution</text>
    <rect x="780" y="354" width="230" height="58" rx="12" fill="#e8f6f3"/>
    <text x="895" y="389" text-anchor="middle" class="card-text">Sentiment  −1 to +1</text>
    <rect x="780" y="428" width="230" height="58" rx="12" fill="#e8f6f3"/>
    <text x="895" y="463" text-anchor="middle" class="card-text">Eight event categories</text>
    <rect x="780" y="502" width="230" height="58" rx="12" fill="#e8f6f3"/>
    <text x="895" y="537" text-anchor="middle" class="card-text">Impact score  1 to 10</text>
    <text x="895" y="590" text-anchor="middle" class="small">Deterministic or pinned-model mode</text>
    <rect x="785" y="612" width="220" height="32" rx="16" fill="#2a9d8f"/>
    <text x="895" y="634" text-anchor="middle" class="badge" fill="#ffffff">EXPLAINABLE RISK SIGNAL</text>
  </g>

  <!-- Services -->
  <g filter="url(#shadow)">
    <rect x="1110" y="205" width="270" height="190" rx="18" fill="#ffffff" stroke="#a8b6c0" stroke-width="2"/>
    <text x="1140" y="250" class="card-title">SQLite Repository</text>
    <text x="1140" y="288" class="card-text">Versioned schema</text>
    <text x="1140" y="322" class="card-text">Signals and entities</text>
    <text x="1140" y="356" class="card-text">Stress decisions and results</text>

    <rect x="1110" y="430" width="270" height="180" rx="18" fill="#edf2fb" stroke="#8da9cf" stroke-width="2"/>
    <text x="1140" y="475" class="card-title">FastAPI v1</text>
    <text x="1140" y="513" class="card-text">Nine typed endpoints</text>
    <text x="1140" y="547" class="card-text">Filtering and pagination</text>
    <text x="1140" y="581" class="card-text">Explicit fixture / live mode</text>
  </g>

  <!-- Downstream -->
  <g filter="url(#shadow)">
    <rect x="1450" y="205" width="280" height="245" rx="18" fill="#fff5ed" stroke="#e9a474" stroke-width="2"/>
    <text x="1480" y="250" class="card-title">Stress Engine</text>
    <text x="1480" y="288" class="card-text">Impact score &gt; 7 trigger</text>
    <text x="1480" y="322" class="card-text">Scenario matrix</text>
    <text x="1480" y="356" class="card-text">Four valuation methods</text>
    <text x="1480" y="390" class="card-text">USD 0.01 reconciliation</text>
    <rect x="1480" y="408" width="202" height="26" rx="13" fill="#f4a261"/>
    <text x="1581" y="427" text-anchor="middle" class="badge" fill="#4c3108">SYNTHETIC PORTFOLIO</text>

    <rect x="1450" y="490" width="280" height="170" rx="18" fill="#ffffff" stroke="#9eb7c5" stroke-width="2"/>
    <text x="1480" y="535" class="card-title">Streamlit Dashboard</text>
    <text x="1480" y="573" class="card-text">Risk signal monitor</text>
    <text x="1480" y="607" class="card-text">Stress lab · source health</text>
    <text x="1480" y="641" class="small">Typed API client · no business logic</text>
  </g>

  <!-- Flow arrows -->
  <path d="M340 268 H375 V588 H340" stroke="#277da1" stroke-width="4" fill="none"/>
  <path d="M340 422 H375" stroke="#277da1" stroke-width="4" fill="none"/>
  <path d="M375 410 H392" class="arrow"/>
  <path d="M680 410 H732" class="arrow"/>
  <path d="M1040 315 H1092" class="arrow"/>
  <path d="M1245 395 V412" class="arrow"/>
  <path d="M1380 520 H1432" class="arrow"/>
  <path d="M1450 330 H1398 V520 H1432" class="arrow"/>
  <path d="M1590 450 V472" class="arrow"/>

  <!-- Cross-cutting governance -->
  <rect x="70" y="730" width="1660" height="230" rx="20" fill="#0b2545"/>
  <text x="110" y="780" class="inverse-lane">CROSS-CUTTING GOVERNANCE AND VERIFICATION</text>
  <g>
    <rect x="110" y="815" width="350" height="100" rx="14" fill="#173c5d"/>
    <text x="135" y="853" class="inverse-title">Provenance and source clarity</text>
    <text x="135" y="884" class="inverse-small">URLs · timestamps · synthetic flags · SHA-256</text>
    <rect x="495" y="815" width="350" height="100" rx="14" fill="#173c5d"/>
    <text x="520" y="853" class="inverse-title">Strict contracts and safe failures</text>
    <text x="520" y="884" class="inverse-small">Pydantic · bounded retries · no silent fallback</text>
    <rect x="880" y="815" width="350" height="100" rx="14" fill="#173c5d"/>
    <text x="905" y="853" class="inverse-title">Offline validation benchmark</text>
    <text x="905" y="884" class="inverse-small">Checksums · golden cases · persisted workflow</text>
    <rect x="1265" y="815" width="425" height="100" rx="14" fill="#173c5d"/>
    <text x="1290" y="853" class="inverse-title">Automated quality gates</text>
    <text x="1290" y="884" class="inverse-small">Pytest suite · Ruff · pip check · GitHub Actions</text>
  </g>

  <text x="70" y="1010" class="small">Public interfaces are optional at runtime. The committed demonstration path is deterministic, offline, and contains no confidential client data.</text>
</svg>
