<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title description">
  <title id="title">RiskSignal Engine implementation architecture</title>
  <desc id="description">The implemented system has two live source adapters and two offline synthetic modes, a provenance-first ingestion layer, deterministic or pinned-model NLP, SQLite persistence, an eleven-route API including an SSE stream, and synthetic portfolio stress testing with a Streamlit dashboard.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b2545"/>
      <stop offset="1" stop-color="#134b70"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0b2545" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#277da1"/>
    </marker>
    <style>
      .title { font: 700 40px Arial, sans-serif; fill: #ffffff; }
      .subtitle { font: 400 20px Arial, sans-serif; fill: #d9eef7; }
      .lane { font: 700 18px Arial, sans-serif; letter-spacing: 1px; fill: #527184; }
      .card-title { font: 700 21px Arial, sans-serif; fill: #0b2545; }
      .card-text { font: 400 16px Arial, sans-serif; fill: #365466; }
      .small { font: 400 14px Arial, sans-serif; fill: #527184; }
      .inverse-lane { font: 700 18px Arial, sans-serif; letter-spacing: 1px; fill: #9ed8ee; }
      .inverse-title { font: 700 19px Arial, sans-serif; fill: #ffffff; }
      .inverse-small { font: 400 14px Arial, sans-serif; fill: #d9eef7; }
      .badge { font: 700 13px Arial, sans-serif; letter-spacing: .4px; }
      .arrow { stroke: #277da1; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .optional { stroke: #7b8790; stroke-width: 3; stroke-dasharray: 9 8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1800" height="1050" fill="#f5f8fa"/>
  <rect width="1800" height="128" fill="url(#header)"/>
  <text x="70" y="60" class="title">RiskSignal Engine</text>
  <text x="70" y="96" class="subtitle">Implemented path: provenance-first signals to explainable synthetic portfolio stress</text>
  <rect x="1515" y="42" width="215" height="45" rx="22" fill="#ffffff" opacity="0.14"/>
  <text x="1622" y="71" text-anchor="middle" class="badge" fill="#ffffff">OFFLINE REPRODUCIBLE</text>

  <text x="70" y="174" class="lane">1  INPUTS</text>
  <text x="410" y="174" class="lane">2  INGESTION</text>
  <text x="750" y="174" class="lane">3  NLP AND SCORING</text>
  <text x="1110" y="174" class="lane">4  PERSISTENCE AND API</text>
  <text x="1450" y="174" class="lane">5  STRESS AND UI</text>

  <!-- Inputs -->
  <g filter="url(#shadow)">
    <rect x="70" y="205" width="270" height="430" rx="18" fill="#ffffff" stroke="#bdd8e5" stroke-width="2"/>
    <text x="100" y="246" class="card-title">Source modes</text>
    <rect x="95" y="270" width="220" height="62" rx="12" fill="#e8f6f3"/>
    <circle cx="115" cy="291" r="7" fill="#2a9d8f"/>
    <text x="130" y="297" class="card-text">GDELT DOC API</text>
    <text x="115" y="319" class="small">live news adapter</text>
    <rect x="95" y="344" width="220" height="62" rx="12" fill="#e8f6f3"/>
    <circle cx="115" cy="365" r="7" fill="#2a9d8f"/>
    <text x="130" y="371" class="card-text">Bluesky AppView</text>
    <text x="115" y="393" class="small">live social adapter</text>
    <rect x="95" y="418" width="220" height="62" rx="12" fill="#fff8e7"/>
    <circle cx="115" cy="439" r="7" fill="#f4a261"/>
    <text x="130" y="445" class="card-text">Fixtures: 6 records</text>
    <text x="115" y="467" class="small">synthetic regression bundle</text>
    <rect x="95" y="492" width="220" height="62" rx="12" fill="#fff8e7"/>
    <circle cx="115" cy="513" r="7" fill="#f4a261"/>
    <text x="130" y="519" class="card-text">Replay: 4 records</text>
    <text x="115" y="541" class="small">synthetic trigger bundle</text>
    <rect x="95" y="578" width="220" height="30" rx="15" fill="#0b2545"/>
    <text x="205" y="598" text-anchor="middle" class="badge" fill="#ffffff">2 LIVE ADAPTERS + 2 BUNDLES</text>
  </g>

  <!-- Ingestion -->
  <g filter="url(#shadow)">
    <rect x="410" y="205" width="270" height="430" rx="18" fill="#eaf5fa" stroke="#73b3d3" stroke-width="2"/>
    <text x="440" y="246" class="card-title">Source adapters</text>
    <rect x="435" y="270" width="220" height="52" rx="10" fill="#ffffff"/>
    <text x="545" y="292" text-anchor="middle" class="card-text">Watchlist OR query</text>
    <text x="545" y="311" text-anchor="middle" class="small">live path only</text>
    <text x="440" y="357" class="card-text">Validate RawDocument contract</text>
    <text x="440" y="391" class="card-text">Normalize text and UTC time</text>
    <text x="440" y="425" class="card-text">Retain URL, query, retrieval</text>
    <text x="440" y="459" class="card-text">Deduplicate by source/hash</text>
    <text x="440" y="493" class="card-text">Isolate adapter failures</text>
    <text x="440" y="527" class="card-text">Mark synthetic + checksums</text>
    <rect x="435" y="565" width="220" height="32" rx="16" fill="#277da1"/>
    <text x="545" y="586" text-anchor="middle" class="badge" fill="#ffffff">NORMALIZED DOCUMENTS</text>
  </g>

  <!-- NLP -->
  <g filter="url(#shadow)">
    <rect x="750" y="205" width="290" height="430" rx="18" fill="#ffffff" stroke="#82c4b6" stroke-width="2"/>
    <text x="780" y="246" class="card-title">RiskSignalEngine</text>
    <text x="780" y="275" class="small">deterministic default | pinned model optional</text>
    <text x="780" y="315" class="card-text">Entity resolution against watchlist</text>
    <text x="780" y="349" class="card-text">Signed sentiment: -1 to +1</text>
    <text x="780" y="383" class="card-text">Eight event categories</text>
    <text x="780" y="417" class="card-text">Impact: integer 1 to 10</text>
    <rect x="775" y="442" width="240" height="112" rx="12" fill="#e8f6f3"/>
    <text x="895" y="466" text-anchor="middle" class="small">impact = 10 x weighted factors</text>
    <text x="895" y="489" text-anchor="middle" class="small">severity 30% | |sentiment| 20%</text>
    <text x="895" y="510" text-anchor="middle" class="small">confidence 20% | entity 15%</text>
    <text x="895" y="531" text-anchor="middle" class="small">corroboration 10% | recency 5%</text>
    <text x="895" y="586" text-anchor="middle" class="small">synthetic batch as_of = max(retrieved_at)</text>
    <rect x="775" y="601" width="240" height="30" rx="15" fill="#2a9d8f"/>
    <text x="895" y="621" text-anchor="middle" class="badge" fill="#ffffff">EXPLAINABLE SIGNAL</text>
  </g>

  <!-- Persistence and API -->
  <g filter="url(#shadow)">
    <rect x="1110" y="205" width="270" height="190" rx="18" fill="#ffffff" stroke="#a8b6c0" stroke-width="2"/>
    <text x="1140" y="246" class="card-title">SQLite schema v1</text>
    <text x="1140" y="282" class="card-text">signals + entities</text>
    <text x="1140" y="314" class="card-text">ingestion runs + statuses</text>
    <text x="1140" y="346" class="card-text">stress decisions + results</text>
    <text x="1140" y="378" class="small">durable ordered signal event log</text>

    <rect x="1110" y="430" width="270" height="205" rx="18" fill="#edf2fb" stroke="#8da9cf" stroke-width="2"/>
    <text x="1140" y="471" class="card-title">FastAPI v1</text>
    <text x="1140" y="505" class="card-text">11 routes = 10 REST + 1 SSE</text>
    <text x="1140" y="537" class="card-text">filters, pagination, contracts</text>
    <text x="1140" y="569" class="card-text">explicit fixtures | replay | live</text>
    <text x="1140" y="601" class="small">SSE cursor + heartbeat; no fallback</text>
  </g>

  <!-- Stress and dashboard -->
  <g filter="url(#shadow)">
    <rect x="1450" y="205" width="280" height="270" rx="18" fill="#fff5ed" stroke="#e9a474" stroke-width="2"/>
    <text x="1480" y="246" class="card-title">Stress engine</text>
    <text x="1480" y="281" class="card-text">strict trigger: impact &gt; 7</text>
    <text x="1480" y="313" class="card-text">8 positions | 4 asset classes</text>
    <text x="1480" y="345" class="card-text">synthetic total: USD 55.50M</text>
    <text x="1480" y="377" class="card-text">4 valuation paths + scenarios</text>
    <text x="1480" y="409" class="card-text">Decimal cents reconciliation</text>
    <rect x="1480" y="429" width="220" height="28" rx="14" fill="#f4a261"/>
    <text x="1590" y="448" text-anchor="middle" class="badge" fill="#4c3108">LOSS SUM = INSTRUMENT SUM</text>

    <rect x="1450" y="505" width="280" height="130" rx="18" fill="#ffffff" stroke="#9eb7c5" stroke-width="2"/>
    <text x="1480" y="543" class="card-title">Streamlit dashboard</text>
    <text x="1480" y="575" class="card-text">timeline | waterfall | health</text>
    <text x="1480" y="607" class="small">observed stress + warned hypothetical</text>
    <text x="1480" y="626" class="small">typed API client; no business logic</text>
  </g>

  <!-- Flow arrows -->
  <path d="M340 420 H392" class="arrow"/>
  <path d="M680 420 H732" class="arrow"/>
  <path d="M1040 300 H1092" class="arrow"/>
  <path d="M1245 395 V412" class="arrow"/>
  <path d="M1380 530 H1432" class="arrow"/>
  <path d="M1590 475 V497" class="arrow"/>
  <path d="M1380 580 V690 H1420 V340 H1432" class="optional"/>
  <text x="1390" y="682" class="small" text-anchor="end">optional poll / auto-stress</text>

  <!-- Cross-cutting governance -->
  <rect x="70" y="730" width="1660" height="230" rx="20" fill="#0b2545"/>
  <text x="110" y="778" class="inverse-lane">CROSS-CUTTING GOVERNANCE AND VERIFIED DATA POINTS</text>
  <g>
    <rect x="110" y="812" width="350" height="105" rx="14" fill="#173c5d"/>
    <text x="135" y="849" class="inverse-title">Provenance and source clarity</text>
    <text x="135" y="878" class="inverse-small">URLs | timestamps | synthetic flags</text>
    <text x="135" y="898" class="inverse-small">11 SHA-256 manifest artifacts</text>
    <rect x="495" y="812" width="350" height="105" rx="14" fill="#173c5d"/>
    <text x="520" y="849" class="inverse-title">Strict execution contracts</text>
    <text x="520" y="878" class="inverse-small">Pydantic | explicit modes | no fallback</text>
    <text x="520" y="898" class="inverse-small">live failures stay visible</text>
    <rect x="880" y="812" width="350" height="105" rx="14" fill="#173c5d"/>
    <text x="905" y="849" class="inverse-title">Offline validation evidence</text>
    <text x="905" y="878" class="inverse-small">8 golden cases | 6 persisted signals</text>
    <text x="905" y="898" class="inverse-small">portfolio and loss reconcile to cents</text>
    <rect x="1265" y="812" width="425" height="105" rx="14" fill="#173c5d"/>
    <text x="1290" y="849" class="inverse-title">Quality gates and runtime scope</text>
    <text x="1290" y="878" class="inverse-small">154 tests | Ruff | validator | CI 3.11 / 3.13</text>
    <text x="1290" y="898" class="inverse-small">no Module A, Kafka, cloud, or client data</text>
  </g>

  <text x="70" y="1010" class="small">Public adapters are optional at runtime. The committed demo path is deterministic, synthetic, offline, and reproducible; live mode never substitutes fixtures.</text>
</svg>
