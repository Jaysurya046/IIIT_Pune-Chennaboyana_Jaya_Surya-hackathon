schema_version: 1

live_sources:
  - id: gdelt_doc_api
    type: news
    url: https://api.gdeltproject.org/api/v2/doc/doc
    access: public unauthenticated HTTPS API
    retention: headline and public metadata only
    documentation: https://blog.gdeltproject.org/gdelt-doc-2-0-api-debuts/

  - id: bluesky_public_appview
    type: social
    url: https://public.api.bsky.app/xrpc/app.bsky.feed.searchPosts
    access: public GET where supported; optional bearer token may be required
    retention: public post text and public metadata
    documentation: https://github.com/bluesky-social/atproto/blob/main/lexicons/app/bsky/feed/searchPosts.json

