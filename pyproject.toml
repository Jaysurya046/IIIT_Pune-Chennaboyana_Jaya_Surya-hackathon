[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-signal-engine"
version = "0.8.0"
description = "Explainable NLP financial risk signals and portfolio stress testing"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [
  { name = "Chennaboyana Jaya Surya", email = "112315046@cse.iiitp.ac.in" },
]
dependencies = [
  "fastapi>=0.142,<1",
  "httpx>=0.28,<1",
  "pandas>=3.0,<4",
  "plotly>=7.1,<8",
  "pydantic>=2.10,<3",
  "streamlit>=1.64,<2",
  "uvicorn>=0.53,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.8,<1",
]
nlp = [
  "sentence-transformers>=3.3,<6",
  "torch>=2.5,<3",
  "transformers>=4.48,<6",
]

[project.scripts]
risksignal = "risk_engine.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -p no:cacheprovider -q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
